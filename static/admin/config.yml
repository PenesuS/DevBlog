backend:
  name: github
  repo: PenesuS/DevBlog
  branch: main
  base_url: https://suhyeoklee0817.pages.dev
  auth_endpoint: api/auth

media_folder: "static/uploads"
public_folder: "/uploads"

collections:
  - name: "posts"
    label: "Development Logs"
    label_singular: "Development Log"
    folder: "content/posts"
    create: true
    path: "{{slug}}/index"
    filter:
      field: cmsType
      value: post
    media_folder: ""
    public_folder: ""
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Thumbnail", name: "thumbnail", widget: "image", required: false }
      - { label: "YouTube Video URL", name: "youtubeUrl", widget: "string", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

      - { label: "Content Type", name: "cmsType", widget: "hidden", default: "post" }

  - name: "projects"
    label: "Projects"
    label_singular: "Project"
    folder: "content/projects"
    create: true
    path: "{{slug}}/index"
    filter:
      field: cmsType
      value: project
    media_folder: ""
    public_folder: ""
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Description", name: "description", widget: "text" }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Thumbnail", name: "thumbnail", widget: "image", required: false }
      - { label: "YouTube Video URL", name: "youtubeUrl", widget: "string", required: false }
      - label: "Gallery Images"
        name: "gallery"
        widget: "list"
        required: false
        field:
          label: "Image"
          name: "image"
          widget: "image"
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Content Type", name: "cmsType", widget: "hidden", default: "project" }

  - name: "pages"
    label: "Pages"
    files:
      - label: "Home"
        name: "home"
        file: "content/home.md"
        fields:
          - { label: "Title", name: "title", widget: "hidden", default: "Home" }
          - { label: "Eyebrow", name: "eyebrow", widget: "string" }
          - { label: "Heading", name: "heading", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }

      - label: "About"
        name: "about"
        file: "content/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Name", name: "name", widget: "string" }
          - { label: "Role", name: "role", widget: "string" }
          - { label: "Subtitle", name: "subtitle", widget: "string" }
          - { label: "Profile Image", name: "profileImage", widget: "image", required: false }
          - { label: "Body", name: "body", widget: "markdown" }